<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── Draggable area ── */
  .widget {
    width: 66px;
    height: 66px;
    position: relative;
    cursor: grab;
    -webkit-app-region: no-drag;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .widget:hover {
    transform: scale(1.12) rotate(-3deg);
  }

  .widget:active {
    cursor: grabbing;
    transform: scale(0.95);
  }

  /* ── Sticky note body ── */
  .note-body {
    width: 58px;
    height: 58px;
    position: absolute;
    bottom: 0;
    left: 4px;
    background: #FFEAA7;
    border-radius: 4px;
    box-shadow:
      2px 3px 10px rgba(180, 140, 100, 0.3),
      0 1px 3px rgba(180, 140, 100, 0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    overflow: hidden;
  }

  /* ── Washi tape ── */
  .tape {
    position: absolute;
    top: -2px;
    left: 50%;
    transform: translateX(-50%) rotate(-2deg);
    width: 30px;
    height: 10px;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 2px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    z-index: 2;
  }

  /* ── Corner fold ── */
  .fold {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 12px;
    height: 12px;
    background: linear-gradient(
      225deg,
      rgba(255, 248, 240, 0.9) 0%,
      rgba(255, 248, 240, 0.3) 50%,
      transparent 50%
    );
    pointer-events: none;
  }

  /* ── Emoji icon ── */
  .icon {
    font-size: 22px;
    line-height: 1;
    margin-top: 2px;
  }

  /* ── Note count badge ── */
  .count {
    font-family: 'Segoe UI', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: #A0896E;
    line-height: 1;
  }

  /* ── Pulse ring on hover ── */
  .pulse-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 66px;
    height: 66px;
    transform: translate(-50%, -50%) scale(0.8);
    border-radius: 50%;
    border: 2px solid rgba(255, 140, 105, 0.4);
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
  }

  .widget:hover .pulse-ring {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.3);
    animation: pulse-fade 1.2s ease-out infinite;
  }

  @keyframes pulse-fade {
    0%   { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0;   transform: translate(-50%, -50%) scale(1.8); }
  }

  /* ── Idle breathing animation ── */
  @keyframes breathe {
    0%, 100% { transform: scale(1) translateY(0); }
    50%      { transform: scale(1.04) translateY(-2px); }
  }

  .widget.idle {
    animation: breathe 3s ease-in-out infinite;
  }

  .widget:hover {
    animation: none;
  }

  /* ── Tooltip ── */
  .tooltip {
    position: absolute;
    bottom: -24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(93, 78, 55, 0.85);
    color: #fff;
    font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }

  .widget:hover .tooltip {
    opacity: 1;
  }

  /* ── Markdown quick-create button ── */
  .md-btn {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 24px;
    height: 24px;
    border: none;
    background: #FF8C69;
    color: white;
    border-radius: 50%;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(255, 140, 105, 0.4);
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    opacity: 0;
    transform: scale(0.6);
    z-index: 10;
    line-height: 1;
  }

  .widget:hover .md-btn {
    opacity: 1;
    transform: scale(1);
  }

  .md-btn:hover {
    background: #FF7755;
    transform: scale(1.15) !important;
  }

  .md-btn:active {
    transform: scale(0.95) !important;
  }
</style>
</head>
<body>
  <div class="widget idle" id="widget">
    <div class="pulse-ring"></div>
    <div class="note-body">
      <div class="tape"></div>
      <span class="icon" id="icon">📌</span>
      <span class="count" id="count"></span>
      <div class="fold"></div>
    </div>
    <button class="md-btn" id="mdBtn" title="新建 Markdown 笔记">📝</button>
    <div class="tooltip">点击打开看板</div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const widget = document.getElementById('widget');
    const countEl = document.getElementById('count');
    const iconEl = document.getElementById('icon');

    // ── Drag vs Click detection ──
    let isDragging = false;
    let dragStarted = false;
    let startX, startY;
    const DRAG_THRESHOLD = 5;

    widget.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      isDragging = true;
      dragStarted = false;
      startX = e.screenX;
      startY = e.screenY;
      widget.classList.remove('idle');
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.screenX - startX;
      const dy = e.screenY - startY;
      if (!dragStarted && (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD)) {
        dragStarted = true;
      }
      if (dragStarted) {
        ipcRenderer.send('widget:drag', { x: e.screenX, y: e.screenY });
      }
    });

    document.addEventListener('mouseup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      if (!dragStarted) {
        // It was a click, not a drag — show main window
        ipcRenderer.send('widget:click');
      }
      // Resume idle animation after a moment
      setTimeout(() => widget.classList.add('idle'), 2000);
    });

    // ── Receive note count from main process ──
    ipcRenderer.on('widget:update-count', (event, count) => {
      countEl.textContent = count > 0 ? count : '';
    });

    // ── Right-click context menu ──
    widget.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      ipcRenderer.send('widget:context-menu');
    });

    // ── Markdown quick-create button ──
    const mdBtn = document.getElementById('mdBtn');
    mdBtn.addEventListener('mousedown', (e) => {
      e.stopPropagation(); // prevent widget drag
    });
    mdBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      ipcRenderer.send('widget:md-new');
    });
  </script>
</body>
</html>
